name: star_tower
description: Faithful Flutter port of lnys/starTower at e41439a.
publish_to: none
version: 1.1.3+6
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.0.10+1
  path_provider: 2.1.4
  audioplayers: 6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/data/
    - assets/audio/
    - assets/images/bg/
    - assets/images/hero/
    - assets/images/items/
    - assets/images/monsters/
    - assets/images/tiles/
    - assets/images/ui/
