plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "cn.fastmini.star_tower"
    compileSdk = 35
    ndkVersion = "26.3.11579264"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "cn.fastmini.star_tower"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            // Flutter integration tests uninstall their package after running.
            applicationIdSuffix = ".debug"
        }
        profile {
            applicationIdSuffix = ".debug"
        }
        release {
            // shortcut: local installation uses debug signing; configure a release key before publishing.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
